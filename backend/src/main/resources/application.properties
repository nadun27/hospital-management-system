server.port=${PORT:8080}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${HMS_SECURE_COOKIE:false}
server.error.include-message=never
spring.datasource.url=${HMS_DB_URL:jdbc:mysql://localhost:3306/hospital_hms?connectionTimeZone=Asia/Colombo}
spring.datasource.username=${HMS_DB_USER:hms_app}
spring.datasource.password=${HMS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.jackson.time-zone=Asia/Colombo
hms.allowed-origin=${HMS_ALLOWED_ORIGIN:http://localhost:4200}
hms.admin-password=${HMS_ADMIN_PASSWORD:}
hms.seed-demo=${HMS_SEED_DEMO:false}
hms.demo-password=${HMS_DEMO_PASSWORD:}
